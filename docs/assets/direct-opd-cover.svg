<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="VeriGate: where to distill"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101527"/><stop offset="1" stop-color="#182a39"/></linearGradient><linearGradient id="line"><stop stop-color="#4ee8c8"/><stop offset="1" stop-color="#9f9bff"/></linearGradient><radialGradient id="orb"><stop stop-color="#6580ec" stop-opacity=".3"/><stop offset="1" stop-color="#101527" stop-opacity="0"/></radialGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><rect width="1280" height="620" rx="26" fill="url(#bg)"/><rect width="1280" height="620" rx="26" fill="url(#grid)"/><circle cx="1040" cy="215" r="330" fill="url(#orb)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="68" y="82" font-size="17" letter-spacing="5" fill="#78ddcd">VERIGATE / RESEARCH</text><text x="63" y="203" font-size="88" font-weight="700" letter-spacing="-3" fill="#f3f6ff">Where to distill.</text><text x="68" y="264" font-size="27" fill="#aab8d0">Ordinal supervision for direct on-policy learning.</text><path d="M68 305H1188" stroke="url(#line)" stroke-width="2"/><text x="68" y="356" font-size="16" letter-spacing="3" fill="#83d4cc">ONE RESPONSE. ONE COEFFICIENT BUDGET.</text><text x="68" y="402" font-size="21" fill="#c3ccde">Student prefixes → teacher distributions → allocated KL</text><g transform="translate(68,445)"><rect width="352" height="116" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#8499bf" stroke-opacity=".23"/><text x="20" y="35" font-size="14" fill="#6ce0cd">01 / DIRECT</text><text x="20" y="79" font-size="19" fill="#e3e9f7">Full-vocabulary forward KL</text></g><g transform="translate(450,445)"><rect width="352" height="116" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#8499bf" stroke-opacity=".23"/><text x="20" y="35" font-size="14" fill="#6ce0cd">02 / ORDINAL</text><text x="20" y="79" font-size="19" fill="#e3e9f7">Ordering over score gaps</text></g><g transform="translate(832,445)"><rect width="352" height="116" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#8499bf" stroke-opacity=".23"/><text x="20" y="35" font-size="14" fill="#6ce0cd">03 / CONTROLLED</text><text x="20" y="79" font-size="19" fill="#e3e9f7">Unit-sum supervision</text></g><g transform="translate(1030,145)" fill="url(#line)"><rect x="0" y="86" width="12" height="24" rx="6" opacity="0.4"/><rect x="24" y="68" width="12" height="42" rx="6" opacity="0.54"/><rect x="48" y="50" width="12" height="60" rx="6" opacity="0.68"/><rect x="72" y="30" width="12" height="80" rx="6" opacity="0.8200000000000001"/><rect x="96" y="2" width="12" height="108" rx="6" opacity="0.9600000000000001"/></g></g></svg>
