<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img">
<rect x="0" y="0" width="1280" height="350" rx="0" fill="#0b1220"/>
<text x="42" y="47" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#65e0c2">THE LEARNING LOOP</text>
<text x="42" y="93" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#f3f7ff">Fresh contexts. One direct objective.</text>
<rect x="42" y="127" width="274" height="153" rx="12" fill="#142235" stroke="#2a3b50"/>
<text x="60" y="159" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#65e0c2">01 / GENERATE</text>
<text x="60" y="202" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#f3f7ff">Student rollouts</text>
<text x="60" y="236" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#a6b6cd">Sample fresh responses</text>
<text x="60" y="261" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#a6b6cd">from the current student.</text>
<polyline points="322,203 343,203" fill="none" stroke="#65e0c2" stroke-width="2" stroke-linejoin="round"/>
<polygon points="343,203 334.22417438109625,207.79425538604204 334.22417438109625,198.20574461395796" fill="#65e0c2"/>
<rect x="349" y="127" width="274" height="153" rx="12" fill="#142235" stroke="#2a3b50"/>
<text x="367" y="159" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#65e0c2">02 / COMPARE</text>
<text x="367" y="202" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#f3f7ff">Full-vocabulary KL</text>
<text x="367" y="236" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#a6b6cd">Evaluate teacher and student</text>
<text x="367" y="261" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#a6b6cd">on the same sampled prefixes.</text>
<polyline points="629,203 650,203" fill="none" stroke="#65e0c2" stroke-width="2" stroke-linejoin="round"/>
<polygon points="650,203 641.2241743810963,207.79425538604204 641.2241743810963,198.20574461395796" fill="#65e0c2"/>
<rect x="656" y="127" width="274" height="153" rx="12" fill="#142235" stroke="#2a3b50"/>
<text x="674" y="159" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#65e0c2">03 / ALLOCATE</text>
<text x="674" y="202" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#f3f7ff">Rank + uniform mix</text>
<text x="674" y="236" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#a6b6cd">Detach scores and weights;</text>
<text x="674" y="261" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#a6b6cd">normalize each response.</text>
<polyline points="936,203 957,203" fill="none" stroke="#65e0c2" stroke-width="2" stroke-linejoin="round"/>
<polygon points="957,203 948.2241743810963,207.79425538604204 948.2241743810963,198.20574461395796" fill="#65e0c2"/>
<rect x="963" y="127" width="274" height="153" rx="12" fill="#142235" stroke="#2a3b50"/>
<text x="981" y="159" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#65e0c2">04 / UPDATE</text>
<text x="981" y="202" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#f3f7ff">Direct distillation</text>
<text x="981" y="236" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#a6b6cd">Backpropagate weighted KL</text>
<text x="981" y="261" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#a6b6cd">through the student only.</text>
<text x="42" y="322" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#a6b6cd">Repeat after every optimizer update</text>
<text x="750" y="322" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#65e0c2">Answer verification runs separately, offline.</text>
</svg>