name: Launcher checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: bash -n scripts/train.sh verigate.sh group.sh baseline.sh ablation_inverse.sh
      - name: Test launcher behavior
        run: python -m unittest discover -s tests -v
