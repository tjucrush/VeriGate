name: CPU research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: for file in scripts/train.sh verigate.sh group.sh baseline.sh ablation_inverse.sh budget.sh; do bash -n "$file"; done
      - name: Install CPU test dependencies
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test reward invariants and launchers
        run: python -m unittest discover -s tests -v
